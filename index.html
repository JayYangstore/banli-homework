<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b1c1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>板栗作业</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #fff;
    --ink: #1c1e21;
    --muted: #9aa0a8;
    --line: #edeef0;
    --accent: #4772fa;
    --green: #34c759;
    --orange: #ff9500;
    --red: #fa5151;
  }
  body.dark {
    --bg: #1b1c1e;
    --card: #2a2b2e;
    --ink: #e8eaed;
    --muted: #9aa3ad;
    --line: #3a3b3f;
    --accent: #5b83fa;
    --green: #4cd964;
    --orange: #ffa21f;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 17px; line-height: 1.5;
    background-attachment: fixed; }
  body.dark { background-color: #1b1c1e; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 12px 14px 32px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; padding: 8px 4px; gap: 8px; flex-wrap: wrap; }
  .title-wrap { flex: 1 1 220px; min-width: 0; }
  .title { font-size: 24px; font-weight: 700; padding: 2px 6px; border-radius: 6px; transition: background 0.15s; }
  .title:hover { background: rgba(127,127,127,0.08); }
  .title[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--card); }
  .date-sub { color: var(--muted); font-size: 13px; padding-left: 6px; }
  .date-nav { display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 10px; padding: 4px; }
  .date-nav button { background: transparent; border: none; cursor: pointer; font-size: 22px; padding: 4px 10px; color: var(--muted); }
  .date-nav .date-label { font-size: 14px; font-weight: 600; padding: 0 6px; min-width: 110px; text-align: center; }
  .progress-card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .progress-text-wide .label { font-size: 13px; color: var(--muted); }
  .progress-text-wide .sub { font-size: 16px; margin-top: 4px; font-weight: 500; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 10px; font-size: 13px; flex-wrap: wrap; gap: 6px; }
  .toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    height: 28px; padding: 0 10px; cursor: pointer; font-size: 12px; color: var(--ink); }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn:active { opacity: 0.7; }
  .icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
  .subject { background: var(--card); border-radius: 14px; margin-bottom: 10px; }
  .subject-head { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .subject-name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; flex: 1; }
  .subject-name .emoji { font-size: 22px; }
  .subject-name .label { padding: 2px 4px; border-radius: 6px; }
  .subject-name .label:hover { background: rgba(127,127,127,0.08); }
  .subject-name .label[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--card); }
  .subject-count { font-size: 13px; color: var(--muted); font-weight: 500; flex-shrink: 0; }
  .subject-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 8px; }
  .subject-del { color: var(--red); font-size: 22px; font-weight: bold; cursor: pointer; padding: 0 6px; line-height: 1; opacity: 0.7; }
  .subject-del:hover { opacity: 1; }
  .subject-name .emoji { cursor: pointer; }
  .subject-name .label { cursor: pointer; }
  .item { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: none; }
  .item:active { background: rgba(127,127,127,0.05); }
  .item.done .text { color: var(--ink); }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d5d8dd; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
  .text { flex: 1; word-break: break-word; min-width: 0; color: var(--ink); }
  .item.done .text { text-decoration: line-through; color: var(--muted); }
  .text[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--card); border-radius: 4px; padding: 4px 6px; }
  .item-del { color: var(--muted); font-size: 18px; padding: 4px 8px; cursor: pointer; }
  .add-item-row { display: flex; gap: 8px; padding: 10px 14px; background: #fafafa; border-top: 1px dashed var(--line); }
  .add-item-row input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 15px; background: var(--card); color: var(--ink); }
  .add-item-row button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  .add-subject { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 14px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; margin-top: 4px; }
  /* 未来日期仍允许编辑: 只做视觉提示(透明度),不去 pointer-events */
  body.future .item, body.future .add-item-row, body.future .add-subject { opacity: 0.5; }
  body.future .item.done { opacity: 0.85; }
  /* 未来日期"预约"徽章 */
  .future-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; background: #ff9500; color: white; font-size: 12px; border-radius: 6px; font-weight: 500; vertical-align: middle; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--card); border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  .modal input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: var(--input-bg, var(--card)); color: var(--ink); }
  .modal .hint { font-size: 11px; color: var(--muted); margin: 4px 0 12px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; }
  .modal button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(28,30,33,0.92); color: white; padding: 10px 20px; border-radius: 8px; z-index: 99999; font-size: 14px; max-width: 90vw; }
  .cal-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99998; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .cal-modal { background: var(--card); border-radius: 12px; padding: 16px; max-width: 360px; width: 100%; color: var(--ink); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 12px; }
  .cal-nav-btn { background: transparent; border: none; color: var(--ink); font-size: 24px; cursor: pointer; padding: 4px 12px; }
  .cal-title { font-size: 18px; font-weight: 700; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 0; font-size: 12px; color: var(--muted); text-align: center; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 0; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 15px; user-select: none; }
  .cal-day.other { color: var(--muted); opacity: 0.4; }
  .cal-day.today { font-weight: 700; border: 1px solid var(--accent); }
  .cal-day.selected { background: var(--accent); color: white; }
  .cal-day:active { background: rgba(127,127,127,0.2); }
  .cal-foot { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 8px; border-top: 1px solid var(--line); }
  .cal-btn { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; color: var(--ink); cursor: pointer; font-size: 14px; }
  body.dark .add-item-row { background: #333438; }
  body.dark .check { border-color: #55585e; }
  /* === Tab 切换 === */
  .tabs { display: flex; gap: 6px; margin: 6px 4px 10px; background: var(--card); border-radius: 12px; padding: 4px; width: fit-content; }
  .tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); transition: all 0.18s; user-select: none; }
  .tab.active { background: var(--accent); color: white; }
  .tab:not(.active):hover { color: var(--ink); background: rgba(127,127,127,0.06); }
  /* === 打卡 section === */
  .plan-card { background: var(--card); border-radius: 14px; margin-bottom: 10px; }
  .plan-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .plan-name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
  .plan-name .emoji { font-size: 22px; cursor: pointer; }
  .plan-name .label { padding: 2px 4px; border-radius: 6px; cursor: pointer; }
  .plan-name .label:hover { background: rgba(127,127,127,0.08); }
  .plan-name .label[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--card); }
  .plan-count { font-size: 13px; color: var(--muted); font-weight: 500; flex-shrink: 0; }
  .plan-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 8px; }
  .plan-del { color: var(--red); font-size: 22px; font-weight: bold; cursor: pointer; padding: 0 6px; line-height: 1; opacity: 0.7; }
  .plan-del:hover { opacity: 1; }
  .add-plan { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 14px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; margin-top: 4px; }
  .check-item { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check-item:last-child { border-bottom: none; }
  .check-item:active { background: rgba(127,127,127,0.05); }
  .check-item.done .ci-text { text-decoration: line-through; color: var(--muted); }
  .ci-text { flex: 1; word-break: break-word; min-width: 0; color: var(--ink); }
  .ci-text[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--card); border-radius: 4px; padding: 4px 6px; }
  .ci-del { color: var(--muted); font-size: 18px; padding: 4px 8px; cursor: pointer; }
  .check-item.done .check { background: var(--accent); border-color: var(--accent); }
  .check-item.done .check::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
  /* 打卡 section 默认隐藏 */
  #plans-wrap { display: none; }
  body.tab-plans #plans-wrap { display: block; }
  body.tab-plans #homework-wrap { display: none; }
  /* 打卡 tab 下隐藏日期切换(长期固定清单,不需要切日期) */
  body.tab-plans .date-nav { display: none; }
  /* 打卡项:长按/右键 重置今日打卡 */
  .check-item:active .ci-text { background: rgba(127,127,127,0.04); }
  .check-item.reset-hint .ci-text::after { content: " (长按取消)"; font-size: 11px; color: var(--muted); }
  /* 累计天数徽章 */
  .plan-badge { display: inline-block; margin-left: 6px; padding: 2px 8px; background: var(--accent); color: white; font-size: 11px; border-radius: 6px; font-weight: 600; vertical-align: middle; }
  /* 全局工具条(已上移到 tabs 下方,作业/打卡 tab 都看得到) */
  body.tab-plans .toolbar .streak { display: none; }
  .toolbar .tb-sep { display: inline-block; width: 1px; height: 18px; background: var(--line); margin: 0 4px; vertical-align: middle; }
  .toolbar .tb-group { display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title-wrap">
      <span class="title" id="title" title="双击改名">板栗今日作业</span>
      <div class="date-sub" id="date-sub"></div>
    </div>
    <div class="date-nav">
      <button id="prev-day"><</button>
      <div class="date-label" id="date-label"></div>
      <button id="next-day">></button>
      <button id="open-cal" title="打开日历" style="font-size:16px">📅</button>
      <!-- 自定义日历弹窗 (iOS Safari 不能用 input type=date 的 showPicker/click) -->
<div class="cal-modal-bg" id="cal-modal" style="display:none">
  <div class="cal-modal">
    <div class="cal-head">
      <button id="cal-prev" class="cal-nav-btn">‹</button>
      <span id="cal-title" class="cal-title">2026年09月</span>
      <button id="cal-next" class="cal-nav-btn">›</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-days" id="cal-days"></div>
    <div class="cal-foot">
      <button id="cal-cancel" class="cal-btn">取消</button>
      <button id="cal-today" class="cal-btn">今天</button>
    </div>
  </div>
</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" id="tab-homework" data-tab="homework">📚 今日作业</div>
    <div class="tab" id="tab-plans" data-tab="plans">🌙 日常打卡</div>
  </div>
  <div class="toolbar">
    <span class="streak" id="streak">🔥 0 天连胜</span>
    <span class="toolbar-right">
      <span class="tb-group">
        <button id="push-btn" class="btn" title="把本地推送到云端">↑推</button>
        <button id="pull-btn" class="btn" title="从云端拉到本地">↓拉</button>
      </span>
      <span class="tb-sep"></span>
      <span class="tb-group">
        <button id="sync-set" class="btn" title="关联/解绑同步">同步</button>
        <button id="auto-sync" class="btn" title="自动同步开关" style="font-size:11px">自动:关</button>
      </span>
      <span class="tb-sep"></span>
      <span class="tb-group">
        <button id="export" class="btn" title="下载 JSON 备份">导出</button>
        <button id="import" class="btn" title="从 JSON 备份恢复">还原</button>
        <button id="clean" class="btn btn-danger" title="清空本地所有数据">清空</button>
      </span>
      <span class="tb-sep"></span>
      <button id="theme" class="icon-btn" title="切换深色/浅色">🌙</button>
    </span>
  </div>
  <div id="homework-wrap">
    <div class="progress-card">
      <div class="progress-text-wide">
        <div class="label">今日完成进度</div>
        <div class="sub" id="progress-sub">还没有作业,先把今天的加上吧 👇</div>
      </div>
    </div>
    <div id="subjects"></div>
    <div class="add-subject" id="add-subject">+ 添加学科</div>
  </div>
  <div id="plans-wrap">
    <div class="progress-card">
      <div class="progress-text-wide">
        <div class="label">今日打卡进度</div>
        <div class="sub" id="plans-progress-sub">先把打卡项目加上吧 👇</div>
      </div>
    </div>
    <div id="plans"></div>
    <div class="add-plan" id="add-plan">+ 新建打卡计划</div>
  </div>
</div>

<script>
// ============ 工具函数 ============
function $(id) { return document.getElementById(id); }
function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function wkcn(d) { return ["\u65e5","\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d"][d.getDay()]; }
function uid() { return Math.random().toString(36).slice(2, 10); }
function showToast(msg, ms) {
  if (!ms) ms = 2200;
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, ms);
}

// ============ 数据存储 ============
const STORAGE_KEY = "banli_homework";
const THEME_KEY = "banli_theme";
const STREAK_KEY = "banli_streak";
const TITLE_KEY = "banli_title";
const SYNC_SHORT_KEY = "banli_sync_short";
const SYNC_TOKEN_KEY = "banli_sync_token";
const SYNC_OWNER_KEY = "banli_sync_owner";
const SYNC_REPO = "JayYangstore/banli-homework";
const SYNC_PATH = "sync/data.json";
const SYNC_BRANCH = "main";

function loadDay(iso) {
  const raw = localStorage.getItem(STORAGE_KEY + "_" + iso);
  if (!raw) return { subjects: [] };
  try { const d = JSON.parse(raw); return d.subjects ? d : { subjects: [] }; }
  catch (e) { return { subjects: [] }; }
}
function saveDay(iso, data) {
  // 给该日数据包盖时间戳,供多端按时间取新
  data._updated_at = Date.now();
  localStorage.setItem(STORAGE_KEY + "_" + iso, JSON.stringify(data));
  triggerSync();
}
function loadStreak() { return parseInt(localStorage.getItem(STREAK_KEY) || "0", 10); }
function saveStreak(n) { localStorage.setItem(STREAK_KEY, String(n)); }

// ============ 日期导航 ============
function todayISO() { return fmt(new Date()); }
function addDays(iso, n) {
  const d = new Date(iso);
  d.setDate(d.getDate() + n);
  return fmt(d);
}
function isFuture(iso) { return iso > todayISO(); }

let viewISO = todayISO();

// ============ 主题 ============
function applyTheme() {
  const dark = localStorage.getItem(THEME_KEY) === "dark";
  document.body.classList.toggle("dark", dark);
  $("theme").textContent = dark ? "\u2600\ufe0f" : "\ud83c\udf19";
}

// ============ 渲染 ============
function render() {
  const data = loadDay(viewISO);
  const c = $("subjects");
  c.innerHTML = "";

  let total = 0, done = 0;
  for (let i = 0; i < data.subjects.length; i++) {
    const subj = data.subjects[i];
    total += subj.items.length;
    let sd = 0;
    for (let j = 0; j < subj.items.length; j++) {
      if (subj.items[j].done) sd++;
    }
    done += sd;
    c.appendChild(renderSubject(subj));
  }

  $("progress-sub").textContent = total === 0
    ? "还没有作业,先把今天的加上吧 \ud83d\udc47"
    : (done === total ? "\u592a\u68d2\u4e86\uff01\u5168\u505a\u5b8c\ud83c\udf89" : done + " / " + total + " \u9879\u5b8c\u6210");

  document.body.classList.toggle("future", isFuture(viewISO));
  const futureBadge = isFuture(viewISO) ? '<span class="future-badge">\ud83d\udcc5 \u9884\u7ea6</span>' : '';
  $("date-label").innerHTML = viewISO.replace(/-/g, ".") + futureBadge;
  $("date-sub").textContent = viewISO + " \u00b7 \u5468" + wkcn(new Date(viewISO));
  $("streak").textContent = "\ud83d\udd25 " + loadStreak() + " \u5929\u8fde\u80dc";
}

// ============ 自定义日历弹窗 ============
let _calYear = 0, _calMonth = 0;

function openCalendar() {
  const d = new Date(viewISO);
  _calYear = d.getFullYear();
  _calMonth = d.getMonth();
  _renderCal();
  $("cal-modal").style.display = "flex";
}

function _renderCal() {
  $("cal-title").textContent = _calYear + "\u5e74" + (_calMonth + 1) + "\u6708";
  const days = $("cal-days");
  days.innerHTML = "";

  const first = new Date(_calYear, _calMonth, 1);
  const firstWk = first.getDay();
  const monthDays = new Date(_calYear, _calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(_calYear, _calMonth, 0).getDate();

  for (let i = firstWk - 1; i >= 0; i--) {
    const d = prevMonthDays - i;
    const el = document.createElement("div");
    el.className = "cal-day other";
    el.textContent = d;
    days.appendChild(el);
  }

  const todayStr = todayISO();
  for (let d = 1; d <= monthDays; d++) {
    const iso = _calYear + "-" + String(_calMonth + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const el = document.createElement("div");
    el.className = "cal-day";
    if (iso === todayStr) el.className += " today";
    if (iso === viewISO) el.className += " selected";
    el.textContent = d;
    el.onclick = function() {
      viewISO = iso;
      $("cal-modal").style.display = "none";
      render();
    };
    days.appendChild(el);
  }

  const totalCells = days.children.length;
  const next = 42 - totalCells;
  for (let d = 1; d <= next; d++) {
    const el = document.createElement("div");
    el.className = "cal-day other";
    el.textContent = d;
    days.appendChild(el);
  }
}

  const sel = window.getSelection();
  sel.removeAllRanges();
  el.onblur = function() {
    el.removeAttribute("contenteditable");
    const data = loadDay(viewISO);
    for (let i = 0; i < data.subjects.length; i++) {
      if (data.subjects[i].name !== subj.name) continue;
      const s = data.subjects[i];
      for (let j = 0; j < s.items.length; j++) {
        if (s.items[j].id === item.id) {
          s.items[j].text = el.textContent.trim() || item.text;
          saveDay(viewISO, data);

    if (e.key === "Escape") { el.textContent = item.text; el.blur(); }
  };
}

async function ghApi(path, method, body) {
  if (!method) method = "GET";
  const token = localStorage.getItem(SYNC_TOKEN_KEY);
  const opts = { method: method, headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json" } };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch("https://api.github.com" + path, opts);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

function b64encode(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

// 判断是否作业日数据对象 { subjects: [...] }
function isDayObj(x) {
  return x && typeof x === "object" && Array.isArray(x.subjects);
}

// 学科级合并:把 a 和 b 两个作业日合并,科学+英语共存,同学科 items 按 id 去重
function mergeDays(a, b) {
  const map = {};         // name -> subject
  const order = [];       // 保持学科显示顺序
  function addSub(s) {
    if (!s || !s.name) return;
    const name = String(s.name);
    if (!(name in map)) {
      map[name] = { name: name, emoji: s.emoji || "", items: [] };
      order.push(name);
    }
    const t = map[name];
    if (s.emoji) t.emoji = s.emoji;
    // 同学科 items 按 id 去重合并
    const items = t.items;
    const ids = {};
    for (const it of items) ids[it.id] = it;
    for (const it of (s.items || [])) {
      if (!it) continue;
      if (it.id && it.id in ids) {
        ids[it.id].done = (ids[it.id].done || it.done) ? true : false;
        if (!ids[it.id].text && it.text) ids[it.id].text = it.text;
      } else {
        items.push({ id: it.id, text: it.text, done: !!it.done });
        if (it.id) ids[it.id] = items[items.length - 1];
      }
    }
  }
  for (const s of (a.subjects || [])) addSub(s);
  for (const s of (b.subjects || [])) addSub(s);
  const out = { subjects: order.map(n => map[n]) };
  const at = a && a._updated_at || 0, bt = b && b._updated_at || 0;
  out._updated_at = Math.max(at, bt);
  return out;
}

async function pushSync() {
  if (_syncInFlight) return;
  _syncInFlight = true;
  try {
    const token = localStorage.getItem(SYNC_TOKEN_KEY);
    if (!token) { showToast("⚠️ 没关联,请点 [同步] 设置"); return; }
    const owner = localStorage.getItem(SYNC_OWNER_KEY) || "device";
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("banli_") && !k.startsWith("banli_sync_")) {
        try { data[k] = JSON.parse(localStorage.getItem(k)); } catch { data[k] = localStorage.getItem(k); }
      }
    }

    // 先看云端:如果有其他设备更新的数据包比本地新,先合并(用时间戳逐条取新)再推,
    // 避免旧设备整包覆盖掉新设备刚写的数据
    let sha = null;
    let merged = data;
    try {
      const cur = await ghApi("/repos/" + SYNC_REPO + "/contents/" + SYNC_PATH + "?ref=" + SYNC_BRANCH);
      sha = cur.sha;
      const bytes = new Uint8Array(atob(cur.content).split("").map(function(c) { return c.charCodeAt(0); }));
      const remoteJson = JSON.parse(new TextDecoder("utf-8").decode(bytes));
      const remote = remoteJson.data || {};
      merged = {};
      const keys = {};
      for (const k in data) keys[k] = true;
      for (const k in remote) if (!(k in keys)) keys[k] = true;
      for (const k in keys) {
        const lv = data[k], rv = remote[k];
        if (lv === undefined) { merged[k] = rv; continue; }
        if (rv === undefined) { merged[k] = lv; continue; }
        // 作业日 key → 学科级合并(科学+英语共存,同学科去重),不整包覆盖
        if (isDayObj(lv) && isDayObj(rv)) { merged[k] = mergeDays(lv, rv); continue; }
        // 其他(对象型)按 _updated_at 时间戳取新
        let lt = (lv && typeof lv === "object" && lv._updated_at) || 0;
        let rt = (rv && typeof rv === "object" && rv._updated_at) || 0;
        merged[k] = rt > lt ? rv : lv;
      }
    } catch (e) { /* 首次 push 云端没有文件,merged 就是本地 */ }

    await ghApi("/repos/" + SYNC_REPO + "/contents/" + SYNC_PATH, "PUT", {
      message: "sync: " + owner,
      content: b64encode(JSON.stringify({ _updated_at: new Date().toISOString(), _updated_by: owner, data: merged }, null, 2)),
      sha: sha,
      branch: SYNC_BRANCH
    });
    showToast("✅ 已同步");
  } catch (e) {
    showToast("⚠️ 推送失败 " + e.message, 3500);
  } finally {
    _syncInFlight = false;
  }
}

async function pullSync() {
  if (_syncInFlight) return;
  _syncInFlight = true;
  try {
    const token = localStorage.getItem(SYNC_TOKEN_KEY);
    if (!token) { showToast("\u26a0\ufe0f \u6ca1\u5173\u8054,\u8bf7\u70b9 [\u540c\u6b65] \u8bbe\u7f6e"); return; }

    const r = await ghApi("/repos/" + SYNC_REPO + "/contents/" + SYNC_PATH + "?ref=" + SYNC_BRANCH);
    const bytes = new Uint8Array(atob(r.content).split("").map(function(c) { return c.charCodeAt(0); }));
    const json = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    const remote = json.data || {};

    let added = 0, updated = 0, skipped = 0;
    for (const k in remote) {
      if (!k.startsWith("banli_")) continue;
      if (k.startsWith("banli_sync_")) continue;  // 不覆盖自己的 token/short/owner
      const cur = localStorage.getItem(k);
      const v = remote[k];

      if (!cur) {
        // 本地没有 → 直接拉
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        added++;
        continue;
      }

      // 本地有 → 先试作业日 key 学科级合并
      let lvP = null;
      try { lvP = JSON.parse(cur); } catch (e) { lvP = null; }
      const rvP = (typeof v === "string" && v !== "") ? (function(){ try { return JSON.parse(v); } catch(e){ return null; } })() : v;
      if (lvP && isDayObj(lvP) && rvP && isDayObj(rvP)) {
        const m = mergeDays(lvP, rvP);
        const s = JSON.stringify(m);
        if (s !== JSON.stringify(lvP)) {
          localStorage.setItem(k, s);
          updated++;
        } else {
          skipped++;
        }
        continue;
      }

      // 本地有 → 按 _updated_at 时间戳取新(对象型数据才比较)
      let remoteTs = 0, localTs = 0;
      try {
        const rv = typeof v === "string" ? JSON.parse(v) : v;
        if (rv && typeof rv === "object" && rv._updated_at) remoteTs = rv._updated_at;
      } catch (e) {}
      try {
        const lv = JSON.parse(cur);
        if (lv && typeof lv === "object" && lv._updated_at) localTs = lv._updated_at;
      } catch (e) {}

      if (remoteTs && localTs) {
        // 两边都有时间戳 → 谁新用谁
        if (remoteTs > localTs) {
          localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
          updated++;
        } else {
          skipped++;  // 本地更新,保留
        }
      } else {
        // 无时间戳(旧数据/非对象)→ 云端有就覆盖(保持旧行为兜底)
        const curVal = cur;
        const isEmpty = curVal === "" || curVal === "{}" || curVal === "[]" || curVal === "null";
        if (isEmpty || !localTs) {
          localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
          updated++;
        } else {
          skipped++;
        }
      }
    }

    // 单独显示云端是谁最后改的
    const owner = json._updated_by || "\u4e0d\u8be6";
    const ts = json._updated_at || "";
    const timeStr = ts ? new Date(ts).toLocaleString("zh-CN") : "";

    let msg = "\u2705 \u4ece\u4e91\u7aef(" + owner + ") \u62c9\u53d6 \u00b7 \u65b0\u589e " + added + " \u00b7 \u66f4\u65b0 " + updated + " \u00b7 \u672c\u5730\u8f83\u65b0\u4fdd\u7559 " + skipped;
    showToast(msg, 4000);
    console.log("pullSync:", { owner, time: ts, added, updated, skipped });
    if (added > 0 || updated > 0) {
      setTimeout(function() { location.reload(); }, 1500);
    }
  } catch (e) {
    let msg = e.message || String(e);
    if (msg.includes("401")) msg = "401 Token \u65e0\u6548";
    else if (msg.includes("404")) msg = "404 \u4e91\u7aef\u6587\u4ef6\u4e0d\u5b58\u5728(\u5148\u63a8\u4e00\u6b21)";
    console.error("pullSync err:", e);
    showToast("\u26a0\ufe0f \u62c9\u53d6\u5931\u8d25: " + msg, 4000);
  } finally {
    _syncInFlight = false;
  }
}

function unlinkSync() {
  if (!confirm("\u89e3\u9664\u5173\u8054\uff1f\u672c\u5730\u6570\u636e\u4fdd\u7559")) return;
  localStorage.removeItem(SYNC_SHORT_KEY);
  localStorage.removeItem(SYNC_TOKEN_KEY);
  localStorage.removeItem(SYNC_OWNER_KEY);
  syncBtnState();
  showToast("\u5df2\u89e3\u7ed1");
}

function triggerSync() {
  if (!(localStorage.getItem(SYNC_SHORT_KEY) && localStorage.getItem(SYNC_TOKEN_KEY))) return;
  if (localStorage.getItem("banli_auto_sync") !== "1") return;  // 自动同步关闭就不推
  clearTimeout(window._st);
  window._st = setTimeout(pushSync, 1500);
}

function toggleAutoSync() {
  const cur = localStorage.getItem("banli_auto_sync");
  localStorage.setItem("banli_auto_sync", cur === "1" ? "" : "1");
  refreshAutoSyncLabel();
  showToast("自动同步: " + (localStorage.getItem("banli_auto_sync") === "1" ? "开" : "关"));
  if (localStorage.getItem("banli_auto_sync") === "1") pushSync();  // 立刻同步一次
}

function refreshAutoSyncLabel() {
  const on = localStorage.getItem("banli_auto_sync") === "1";
  const btn = $("auto-sync");
  if (btn) {
    btn.textContent = "自动:" + (on ? "开" : "关");
    btn.style.color = on ? "var(--accent)" : "var(--muted)";
  }
}

// ============ 备份 / 导入 / 清空 ============
function exportData() {
  const dump = { _app: "banli-homework", _exported_at: new Date().toISOString(), keys: {} };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("banli_")) {
      try { dump.keys[k] = JSON.parse(localStorage.getItem(k)); } catch { dump.keys[k] = localStorage.getItem(k); }
    }
  }
  const json = JSON.stringify(dump, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "banli-backup-" + fmt(new Date()) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("\u2705 \u5df2\u5bfc\u51fa " + Object.keys(dump.keys).length + " \u9879");
}

function importData() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = function(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function(ev) {
      try {
        const d = JSON.parse(ev.target.result);
        if (d._app !== "banli-homework" || !d.keys) { alert("\u683c\u5f0f\u4e0d\u5bf9"); return; }
        if (!confirm("\u8986\u76d6\u672c\u5730 localStorage\uff1f\u5c06\u5408\u5e76 " + Object.keys(d.keys).length + " \u9879\u3002\n\u5efa\u8bae\u5148\u70b9\u300c\u5bfc\u51fa\u300d\u5907\u4efd\u5f53\u524d\u6570\u636e\u3002")) return;
        let n = 0;
        for (const k in d.keys) {
          if (!k.startsWith("banli_")) continue;
          const v = d.keys[k];
          localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
          n++;
        }
        showToast("\u2705 \u5df2\u8fd8\u539f " + n + " \u9879,\u5237\u65b0\u4e2d...");
        setTimeout(function() { location.reload(); }, 1200);
      } catch (e) { alert("\u89e3\u6790\u5931\u8d25\uff1a" + e.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

function cleanAll() {
  if (!confirm("⚠️ 清空所有本地 banli_ 数据？\n包括板栗作业、连胜、同步配置。\n云端数据不受影响。")) return;
  const ks = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("banli_")) ks.push(k);
  }
  for (let i = 0; i < ks.length; i++) localStorage.removeItem(ks[i]);
  showToast("✅ 已清 " + ks.length + " 项,刷新中...");
  setTimeout(function() { location.reload(); }, 1200);
}

// ============ Tab 切换 ============
let currentTab = localStorage.getItem("banli_active_tab") || "homework";
const TITLE_HOMEWORK_DEFAULT = "板栗今日作业";
const TITLE_PLANS_DEFAULT = "板栗日常打卡";
function switchTab(name) {
  currentTab = name;
  localStorage.setItem("banli_active_tab", name);
  document.body.classList.toggle("tab-plans", name === "plans");

$("tab-plans").onclick = function() { switchTab("plans"); };

// ============ 打卡计划 数据 ============
const PLANS_KEY = "banli_plans_v2";        // 计划定义 + 打卡项(每项含 lastDone 时间戳,跨日期共享)
const PLANS_KEY_OLD = "banli_plans";       // 旧版迁移源
const CHECKS_KEY_PREFIX_OLD = "banli_checks_"; // 旧版按日期打卡记录(只用于迁移一次)

function loadPlans() {
  const raw = localStorage.getItem(PLANS_KEY);
  if (!raw) return { plans: [] };
  try { const d = JSON.parse(raw); return d.plans ? d : { plans: [] }; }
  catch (e) { return { plans: [] }; }
}
function savePlans(d) {
  d._updated_at = Date.now();
  localStorage.setItem(PLANS_KEY, JSON.stringify(d));
  triggerSync();
}
// 一次性迁移:旧版 banli_plans(无 lastDone) + banli_checks_YYYY-MM-DD → 新版
function migrateOldPlans() {
  if (localStorage.getItem(PLANS_KEY)) return; // 新版已存在
  const oldRaw = localStorage.getItem(PLANS_KEY_OLD);
  if (!oldRaw) return;
  let oldData = null;
  try { oldData = JSON.parse(oldRaw); } catch (e) { return; }
  if (!oldData || !Array.isArray(oldData.plans)) return;
  // 收集所有旧版按日期打卡记录,合并到 plan.items[].lastDone
  const checksByDate = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(CHECKS_KEY_PREFIX_OLD)) {
      try { checksByDate[k.slice(CHECKS_KEY_PREFIX_OLD.length)] = JSON.parse(localStorage.getItem(k)) || {}; }
      catch (e) {}
    }
  }
  // 新版:每个 item 加 lastDone(最近一次打卡的 timestamp)
  const dates = Object.keys(checksByDate).sort().reverse(); // 从近到远
  for (const plan of oldData.plans) {
    for (const item of (plan.items || [])) {
      item.lastDone = 0;
      // 找最近一次 plan.id 含 item.id 的打卡
      for (const d of dates) {
        const rec = checksByDate[d];
        if (rec && rec[plan.id] && rec[plan.id].indexOf(item.id) >= 0) {
          item.lastDone = new Date(d + "T23:59:59").getTime();
          break;
        }
      }
    }
    plan.items = plan.items || [];
  }
  savePlans(oldData);
  // 不删旧数据(可手动清空,或下次升级再删)
}

// 首次使用自动建一个"睡前准备"计划(无预置事项,板栗自己加)
function ensureDefaultPlan() {
  migrateOldPlans();
  const d = loadPlans();
  if (d.plans.length === 0) {
    d.plans.push({
      id: "plan_sleep",
      name: "睡前准备",
      emoji: "🌙",
      items: []
    });
    savePlans(d);
  }
}
ensureDefaultPlan();

// 今天 0 点的 timestamp(用于判定"今天是否完成")
function todayStartTs() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
}

// ============ 渲染打卡 ============
function renderPlans() {
  const data = loadPlans();
  const ts0 = todayStartTs();
  const wrap = $("plans");
  wrap.innerHTML = "";

  if (data.plans.length === 0) {
    $("plans-progress-sub").textContent = "还没有打卡计划,点下方 + 新建一个";
    return;
  }

  let total = 0, done = 0;
  for (let i = 0; i < data.plans.length; i++) {
    const p = data.plans[i];
    let pdone = 0;
    for (const it of p.items) {
      if ((it.lastDone || 0) >= ts0) pdone++;
    }
    total += p.items.length; done += pdone;
    wrap.appendChild(renderPlan(p, ts0));
  }

  $("plans-progress-sub").textContent = total === 0
    ? "计划里还没有项目,点开计划加吧 👇"
    : (done === total && total > 0 ? "🌟 今日全部打卡完成！板栗太棒了" : done + " / " + total + " 项完成（每天 0 点自动重置）");
}

function renderPlan(plan, ts0) {
  const card = document.createElement("div");
  card.className = "plan-card";

  const head = document.createElement("div");
  head.className = "plan-head";

  const name = document.createElement("div");
  name.className = "plan-name";
  const emoji = document.createElement("span");
  emoji.className = "emoji";
  emoji.textContent = plan.emoji || "🌙";
  name.appendChild(emoji);
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = plan.name;
  name.appendChild(label);

  // 已完成 N 项 / 总 N 项 + 累计天数徽章(取 plan 内最多连击的那个 item)
  let pdone = 0, bestStreak = 0;
  for (const it of plan.items) {
    if ((it.lastDone || 0) >= ts0) pdone++;
    if ((it.streak || 0) > bestStreak) bestStreak = it.streak;
  }
  const count = document.createElement("div");
  count.className = "plan-count";
  count.textContent = pdone + " / " + plan.items.length;

  const right = document.createElement("div");
  right.className = "plan-right";
  right.appendChild(count);
  if (bestStreak > 0) {
    const badge = document.createElement("span");
    badge.className = "plan-badge";
    badge.textContent = "🔥 " + bestStreak + " 天";
    right.appendChild(badge);
  }
  const del = document.createElement("div");
  del.className = "plan-del";
  del.textContent = "×";
  del.title = "删除整个计划(及里面所有打卡项)";
  del.onclick = function(e) {
    e.stopPropagation();
    if (confirm("删除计划『" + plan.name + "』？\n里面 " + plan.items.length + " 个打卡项也会一起删除")) {
      deletePlan(plan.id);
    }
  };
  right.appendChild(del);

  head.appendChild(name);
  head.appendChild(right);
  card.appendChild(head);

  emoji.title = "双击改 emoji";
  emoji.ondblclick = function(e) {
    e.stopPropagation();
    const next = prompt("改图标 emoji", plan.emoji || "🌙");
    if (next === null) return;
    const trimmed = next.trim();
    if (!trimmed) return;
    plan.emoji = trimmed;
    const d = loadPlans();
    const p = d.plans.find(x => x.id === plan.id);
    if (p) p.emoji = trimmed;
    savePlans(d);
    renderPlans();
  };
  label.title = "双击改名字";
  label.ondblclick = function(e) {
    e.stopPropagation();
    label.setAttribute("contenteditable", "true");
    label.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    label.onblur = function() {
      label.removeAttribute("contenteditable");
      const newName = label.textContent.trim() || plan.name;
      label.textContent = newName;
      const d = loadPlans();
      const p = d.plans.find(x => x.id === plan.id);
      if (p) p.name = newName;
      savePlans(d);
    };
    label.onkeydown = function(e) {
      if (e.key === "Enter") { e.preventDefault(); label.blur(); }
      if (e.key === "Escape") { label.textContent = plan.name; label.blur(); }
    };
  };

  for (let i = 0; i < plan.items.length; i++) {
    const it = plan.items[i];
    const isDone = (it.lastDone || 0) >= ts0;
    card.appendChild(renderCheckItem(plan, it, isDone));
  }

  // 添加新打卡项输入行
  const addRow = document.createElement("div");
  addRow.className = "add-item-row";
  const input = document.createElement("input");
  input.placeholder = "新打卡项…\u00a0回车存";
  const btn = document.createElement("button");
  btn.textContent = "+";
  function addIt() {
    const v = input.value.trim();
    if (!v) return;
    addCheckItem(plan.id, v);
    input.value = "";
  }
  btn.onclick = addIt;
  input.onkeydown = function(e) { if (e.key === "Enter") addIt(); };
  addRow.appendChild(input);
  addRow.appendChild(btn);
  card.appendChild(addRow);

  return card;
}

function renderCheckItem(plan, item, isDone) {
  const row = document.createElement("div");
  row.className = "check-item" + (isDone ? " done" : "");

  const check = document.createElement("div");
  check.className = "check";
  row.appendChild(check);

  const text = document.createElement("div");
  text.className = "ci-text";
  text.textContent = item.text;
  row.appendChild(text);

  const del = document.createElement("div");
  del.className = "ci-del";
  del.textContent = "×";
  del.onclick = function(e) {
    e.stopPropagation();
    if (confirm("删除打卡项『" + item.text + "』？\n(累计 " + (item.streak || 0) + " 天也会清掉)")) deleteCheckItem(plan.id, item.id);
  };
  row.appendChild(del);

  // 点圆圈:切换今天打卡状态
  check.onclick = function(e) { e.stopPropagation(); toggleCheck(plan.id, item.id); };
  // 单击整行:也切换
  row.onclick = function() { toggleCheck(plan.id, item.id); };
  // 长按整行:取消(重置)
  let longPressTimer = null;
  row.addEventListener("touchstart", function() {
    longPressTimer = setTimeout(function() { resetCheck(plan.id, item.id); longPressTimer = null; }, 600);
  });
  row.addEventListener("touchend", function() { if (longPressTimer) clearTimeout(longPressTimer); });
  row.oncontextmenu = function(e) { e.preventDefault(); resetCheck(plan.id, item.id); return false; };

  text.ondblclick = function(e) {
    e.stopPropagation();
    text.setAttribute("contenteditable", "true");
    text.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    text.onblur = function() {
      text.removeAttribute("contenteditable");
      const newText = text.textContent.trim() || item.text;
      text.textContent = newText;
      const d = loadPlans();
      const p = d.plans.find(x => x.id === plan.id);
      if (p) {
        const it = p.items.find(x => x.id === item.id);
        if (it) it.text = newText;
      }
      savePlans(d);
    };
    text.onkeydown = function(e) {
      if (e.key === "Enter") { e.preventDefault(); text.blur(); }
      if (e.key === "Escape") { text.textContent = item.text; text.blur(); }
    };
  };
  return row;
}

// 切换今日打卡:未打卡→打卡(设 lastDone = now,连击 +1),已打卡→重置
function toggleCheck(planId, itemId) {
  const d = loadPlans();
  const p = d.plans.find(x => x.id === planId);
  if (!p) return;
  const it = p.items.find(x => x.id === itemId);
  if (!it) return;
  const ts0 = todayStartTs();
  if ((it.lastDone || 0) >= ts0) {
    // 已打卡 → 取消(回退连击)
    it.lastDone = 0;
    it.streak = Math.max(0, (it.streak || 0) - 1);
  } else {
    // 未打卡 → 完成
    it.lastDone = Date.now();
    it.streak = (it.streak || 0) + 1;
  }
  savePlans(d);
  renderPlans();
}
function resetCheck(planId, itemId) {
  const d = loadPlans();
  const p = d.plans.find(x => x.id === planId);
  if (!p) return;
  const it = p.items.find(x => x.id === itemId);
  if (!it) return;
  it.lastDone = 0;
  savePlans(d);
  showToast("已重置");
  renderPlans();
}

function addCheckItem(planId, text) {
  const d = loadPlans();
  const p = d.plans.find(x => x.id === planId);
  if (!p) return;
  p.items.push({ id: uid(), text: text, lastDone: 0, streak: 0 });
  savePlans(d);
  renderPlans();
}

function deleteCheckItem(planId, itemId) {
  const d = loadPlans();
  const p = d.plans.find(x => x.id === planId);
  if (!p) return;
  p.items = p.items.filter(x => x.id !== itemId);
  savePlans(d);
  renderPlans();
}

function deletePlan(planId) {
  const d = loadPlans();
  d.plans = d.plans.filter(x => x.id !== planId);
  savePlans(d);
  showToast("✅ 已删除计划");
  renderPlans();
}

function addPlan() {
  const name = prompt("新建打卡计划名字", "新计划");
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  const emoji = prompt("选个图标 emoji (留空默认 🌙)", "🌙") || "🌙";
  const d = loadPlans();
  const id = "plan_" + uid();
  d.plans.push({ id: id, name: trimmed, emoji: emoji.trim() || "🌙", items: [] });
  savePlans(d);
  renderPlans();
}
$("add-plan").onclick = addPlan;

// ============ 标题双击改名 ============
function bindTitleEdit() {
  const t = $("title");
  t.addEventListener("dblclick", function() {
    // 未来日期也允许改标题
    t.setAttribute("contenteditable", "true");
    t.focus();
    // 光标定位不全选,可逐字编辑
    const sel = window.getSelection();
    sel.removeAllRanges();
    t.onblur = function() {
      t.removeAttribute("contenteditable");
      localStorage.setItem(TITLE_KEY, t.textContent.trim() || "\u677f\u6817\u4eca\u65e5\u4f5c\u4e1a");
    };
    t.onkeydown = function(e) { if (e.key === "Enter") { e.preventDefault(); t.blur(); } };
  });
}

// ============ 启动 ============
window.addEventListener("load", function() {
  const savedTitle = localStorage.getItem(TITLE_KEY);
  if (savedTitle) $("title").textContent = savedTitle;

  applyTheme();
  render();
  syncBtnState();

  $("prev-day").onclick = function() { viewISO = addDays(viewISO, -1); render(); };
  $("next-day").onclick = function() { viewISO = addDays(viewISO, 1); render(); };
  $("open-cal").onclick = function() { openCalendar(); };
  $("theme").onclick = function() {
    localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY) === "dark" ? "" : "dark");
    applyTheme();
  };
  $("add-subject").onclick = addSubject;
  $("export").onclick = exportData;
  $("import").onclick = importData;
  $("clean").onclick = cleanAll;
  $("push-btn").onclick = pushSync;
  $("pull-btn").onclick = pullSync;
  $("sync-set").onclick = showSyncModal;
  $("auto-sync").onclick = toggleAutoSync;
  bindTitleEdit();
  refreshAutoSyncLabel();
  // URL 参数覆盖 tab(便于分享链接直接打开某个 tab)
  const _urlTab = new URLSearchParams(location.search).get("tab");
  if (_urlTab === "plans" || _urlTab === "homework") currentTab = _urlTab;
  switchTab(currentTab);  // 恢复上次选中的 tab(默认 homework)
  // 钩住日期切换:切到 plans tab 时也要刷
  const _origPrev = $("prev-day").onclick;
  $("prev-day").onclick = function() { viewISO = addDays(viewISO, -1); render(); if (currentTab === "plans") renderPlans(); };
  const _origNext = $("next-day").onclick;
  $("next-day").onclick = function() { viewISO = addDays(viewISO, 1); render(); if (currentTab === "plans") renderPlans(); };
  $("open-cal").onclick = function() {
    const _origOpen = openCalendar;
    const modal = $("cal-modal");
    const oldOnclick = modal.onclick;
    modal.onclick = function(e) {
      if (e.target.id === "cal-modal") { modal.style.display = "none"; render(); if (currentTab === "plans") renderPlans(); }
    };
    // 日历选日期会重渲染,选完切 tab 也得刷
    _origOpen();
    // 重写 cal-day 内部 onclick(因为 _renderCal 闭包,这里只能改全局)
    // 简化:日历选完会调 render(), 我们改 render() 不行(会破坏作业), 所以用 listener
  };
  // 更简洁:监听 render() 之后 + 切 tab 后
  // 直接包装 render()
  const _origRender = render;
  render = function() { _origRender(); if (currentTab === "plans") renderPlans(); };
});
